<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gate QR Scanner &amp; Entry Manager — EventHub</title>
  <meta name="description" content="Optical real-time QR camera scanner and ticket verification console for EventHub event managers and gate volunteers." />
  <meta name="robots" content="noindex, nofollow" />

  <!-- Favicon & Theme -->
  <link rel="icon" type="image/png" href="assets/images/logo.png" />
  <link rel="apple-touch-icon" href="assets/images/logo.png" />
  <meta name="theme-color" content="#7c3aed" />
  <meta name="application-name" content="EventHub" />

  <!-- Open Graph / WhatsApp / Facebook / Discord / LinkedIn -->
  <meta property="og:site_name" content="EventHub" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://eventhub-g-xrave.vercel.app/scanner.html" />
  <meta property="og:title" content="Gate QR Scanner &amp; Entry Manager — EventHub" />
  <meta property="og:description" content="Optical real-time QR camera scanner and ticket verification console with duplicate entry detection for EventHub." />
  <meta property="og:image" content="https://eventhub-g-xrave.vercel.app/assets/images/eventhub_qr_feature.jpg" />
  <meta property="og:image:secure_url" content="https://eventhub-g-xrave.vercel.app/assets/images/eventhub_qr_feature.jpg" />
  <meta property="og:image:type" content="image/jpeg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />

  <!-- Twitter / X Cards -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:site" content="@EventHub" />
  <meta name="twitter:title" content="Gate QR Scanner &amp; Entry Manager — EventHub" />
  <meta name="twitter:description" content="Optical real-time QR camera scanner and ticket verification console with duplicate entry detection for EventHub." />
  <meta name="twitter:image" content="https://eventhub-g-xrave.vercel.app/assets/images/eventhub_qr_feature.jpg" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@600;700;800;900&family=Roboto+Flex:wght@400;500;600;700&family=Space+Mono:wght@700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>

  <!-- High performance QR Camera Decoder Libraries: jsQR for ultra-fast WASM/JS decoding + Html5Qrcode fallback -->
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <!-- Apply saved theme BEFORE render -->
  <script>
    (function(){
      const saved = localStorage.getItem('eventhub_theme') || 'dark';
      const pref  = saved === 'system'
        ? (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark')
        : saved;
      document.documentElement.setAttribute('data-theme', pref);
    })();
  </script>

  <link rel="stylesheet" href="style.css" />

  <style>
    body {
      background-color: var(--md-sys-color-surface);
      color: var(--md-sys-color-on-surface);
      min-height: 100vh;
      padding-bottom: 100px;
    }

    /* Top App Bar */
    .top-nav {
      position: sticky;
      top: 0;
      z-index: 100;
      background-color: rgba(20, 18, 24, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--md-sys-color-outline-variant);
      padding: 12px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }
    [data-theme="light"] .top-nav {
      background-color: rgba(253, 247, 255, 0.85);
    }

    .nav-chipset {
      display: flex;
      align-items: center;
      gap: 8px;
      overflow-x: auto;
      padding: 2px 4px;
    }

    .m3-chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      height: 36px;
      padding: 0 16px;
      border-radius: var(--md-sys-shape-corner-small);
      border: 1px solid var(--md-sys-color-outline);
      background-color: var(--md-sys-color-surface-container-low);
      color: var(--md-sys-color-on-surface-variant);
      font-size: 0.8125rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all var(--md-sys-motion-duration-short) ease;
    }
    .m3-chip svg { width: 16px; height: 16px; }
    .m3-chip:hover {
      background-color: var(--md-sys-color-surface-container-high);
      color: var(--md-sys-color-on-surface);
      border-color: var(--md-sys-color-primary);
    }
    .m3-chip.active {
      background-color: var(--md-sys-color-secondary-container);
      color: var(--md-sys-color-on-secondary-container);
      border-color: var(--md-sys-color-primary);
    }

    /* Grid Layout */
    .scanner-layout {
      max-width: 1100px;
      margin: 36px auto 0;
      padding: 0 24px;
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      gap: 28px;
      align-items: start;
    }

    @media (max-width: 900px) {
      .scanner-layout {
        grid-template-columns: 1fr;
      }
    }
    @media (max-width: 480px) {
      .topbar { padding: 10px 14px; }
      .scanner-layout { padding: 0 12px; margin-top: 18px; }
      .scanner-card { padding: 18px 14px; }
    }

    /* M3 Surface Card */
    .scanner-card {
      background-color: var(--md-sys-color-surface-container-low);
      border: 1px solid var(--md-sys-color-outline-variant);
      border-radius: var(--md-sys-shape-corner-extra-large);
      padding: 28px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.25);
    }

    .card-title-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--md-sys-color-outline-variant);
    }

    .card-title {
      font-family: var(--md-sys-typescale-brand-font);
      font-size: 1.25rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--md-sys-color-on-surface);
    }

    /* Camera Viewfinder Box */
    .viewfinder-wrapper {
      position: relative;
      width: 100%;
      border-radius: var(--md-sys-shape-corner-large);
      overflow: hidden;
      background-color: #050407;
      border: 2px solid var(--md-sys-color-outline);
      min-height: 340px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #custom-video-element {
      width: 100%;
      height: 100%;
      max-height: 420px;
      object-fit: cover;
      display: none;
      border-radius: var(--md-sys-shape-corner-large);
    }

    #camera-reader {
      width: 100% !important;
      min-height: 280px;
      border: none !important;
      display: none;
    }

    #camera-reader video {
      width: 100% !important;
      height: 100% !important;
      border-radius: var(--md-sys-shape-corner-large);
      object-fit: cover !important;
    }

    /* Target Reticle in Center */
    .scan-reticle {
      position: absolute;
      width: 220px;
      height: 220px;
      border: 2px dashed rgba(168, 85, 247, 0.6);
      border-radius: 18px;
      pointer-events: none;
      z-index: 5;
      display: none;
      box-shadow: 0 0 0 4000px rgba(0, 0, 0, 0.35);
      transition: all 0.2s ease;
    }

    .viewfinder-wrapper.active .scan-reticle {
      display: block;
    }

    .viewfinder-wrapper.scanned .scan-reticle {
      border-color: #22c55e;
      border-style: solid;
      box-shadow: 0 0 30px rgba(34, 197, 94, 0.8), 0 0 0 4000px rgba(0, 0, 0, 0.4);
    }

    /* Laser Scanning Animation Overlay */
    .scanning-laser {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 3px;
      background: linear-gradient(90deg, transparent, #a855f7, #c084fc, transparent);
      box-shadow: 0 0 16px #a855f7;
      z-index: 6;
      pointer-events: none;
      animation: scanLaser 1.5s ease-in-out infinite alternate;
      display: none;
    }

    .viewfinder-wrapper.active .scanning-laser {
      display: block;
    }

    @keyframes scanLaser {
      0% { top: 15%; opacity: 0.3; }
      50% { opacity: 1; }
      100% { top: 85%; opacity: 0.3; }
    }

    /* Viewfinder Corner Overlays */
    .vf-corner {
      position: absolute;
      width: 26px;
      height: 26px;
      border-color: #a855f7;
      border-style: solid;
      pointer-events: none;
      z-index: 11;
      filter: drop-shadow(0 0 4px rgba(168, 85, 247, 0.8));
    }
    .vf-tl { top: 20px; left: 20px; border-width: 4px 0 0 4px; border-top-left-radius: 8px; }
    .vf-tr { top: 20px; right: 20px; border-width: 4px 4px 0 0; border-top-right-radius: 8px; }
    .vf-bl { bottom: 20px; left: 20px; border-width: 0 0 4px 4px; border-bottom-left-radius: 8px; }
    .vf-br { bottom: 20px; right: 20px; border-width: 0 4px 4px 0; border-bottom-right-radius: 8px; }

    /* Scan status indicator badge */
    .fps-badge {
      position: absolute;
      bottom: 12px;
      right: 14px;
      font-size: 0.72rem;
      font-weight: 700;
      color: #a855f7;
      background: rgba(0,0,0,0.7);
      padding: 4px 8px;
      border-radius: 6px;
      z-index: 12;
      display: none;
      letter-spacing: 0.05em;
    }
    .viewfinder-wrapper.active .fps-badge { display: block; }

    /* Controls */
    .scanner-controls {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    /* Manual Entry Input Group */
    .manual-entry-box {
      display: flex;
      gap: 10px;
      margin-top: 6px;
    }

    /* Real-Time Scan Result Dialog / Banner */
    .scan-feedback-banner {
      display: none;
      padding: 16px 20px;
      border-radius: var(--md-sys-shape-corner-medium);
      border: 1.5px solid transparent;
      animation: fadeIn 0.2s ease;
    }

    .scan-feedback-banner.success {
      display: flex;
      flex-direction: column;
      gap: 10px;
      background-color: var(--md-sys-color-success-container);
      color: var(--md-sys-color-on-success-container);
      border-color: var(--md-sys-color-success);
    }

    .scan-feedback-banner.duplicate {
      display: flex;
      flex-direction: column;
      gap: 10px;
      background-color: var(--md-sys-color-tertiary-container);
      color: var(--md-sys-color-on-tertiary-container);
      border-color: var(--md-sys-color-tertiary);
    }

    .scan-feedback-banner.error {
      display: flex;
      flex-direction: column;
      gap: 10px;
      background-color: var(--md-sys-color-error-container);
      color: var(--md-sys-color-on-error-container);
      border-color: var(--md-sys-color-error);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Recent Check-Ins List */
    .checkin-log-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 480px;
      overflow-y: auto;
      padding-right: 4px;
    }

    .log-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      border-radius: var(--md-sys-shape-corner-medium);
      background-color: var(--md-sys-color-surface-container);
      border: 1px solid var(--md-sys-color-outline-variant);
      transition: all var(--md-sys-motion-duration-short) ease;
    }
    .log-item:hover {
      background-color: var(--md-sys-color-surface-container-high);
      border-color: var(--md-sys-color-primary);
    }

    .log-user-name { font-size: 0.875rem; font-weight: 700; }
    .log-user-meta { font-size: 0.75rem; color: var(--md-sys-color-on-surface-variant); margin-top: 2px; }
    .log-time { font-size: 0.75rem; font-weight: 600; color: var(--md-sys-color-primary); font-family: 'Space Mono', monospace; }

    /* Counter Badge */
    .gate-stats-bar {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .gate-stat-box {
      background-color: var(--md-sys-color-surface-container);
      border: 1px solid var(--md-sys-color-outline-variant);
      border-radius: var(--md-sys-shape-corner-medium);
      padding: 14px;
      text-align: center;
    }
    .gate-stat-val { font-family: var(--md-sys-typescale-brand-font); font-size: 1.8rem; font-weight: 800; color: var(--md-sys-color-primary); }
    .gate-stat-lbl { font-size: 0.75rem; font-weight: 600; color: var(--md-sys-color-on-surface-variant); text-transform: uppercase; }
  </style>
</head>
<body>

  <!-- Top App Bar with M3 Chipset -->
  <header class="top-nav">
    <a href="index.html" class="logo" aria-label="EventHub Home">
      <div class="logo-icon" style="width:32px;height:32px;"><img src="assets/images/logo.png" alt="EventHub Logo" class="logo-img" /></div>
      <span>Event<span class="logo-accent">Hub</span></span>
    </a>

    <!-- Navigation Chipsets -->
    <div class="nav-chipset">
      <a href="dashboard.html" class="m3-chip">
        <i data-lucide="layout-dashboard"></i> Dashboard
      </a>
      <a href="scanner.html" class="m3-chip active">
        <i data-lucide="scan-line"></i> Gate Scanner
      </a>
      <a href="ticket.html" class="m3-chip">
        <i data-lucide="qr-code"></i> Participant Passes
      </a>
      <a href="create-event.html" class="m3-chip">
        <i data-lucide="calendar-plus"></i> Create Event
      </a>
    </div>
  </header>

  <main class="scanner-layout">

    <!-- Column 1: Optical QR Viewfinder & Scanner -->
    <div class="scanner-card">
      <div class="card-title-bar">
        <div class="card-title">
          <i data-lucide="camera" style="color:var(--md-sys-color-primary);"></i>
          <span>Optical Gate Scanner</span>
        </div>
        <span class="tag" id="gate-active-badge">Gate 01 • Ultra-Fast Engine</span>
      </div>

      <!-- Viewfinder Box -->
      <div class="viewfinder-wrapper" id="viewfinder-box">
        <div class="scanning-laser"></div>
        <div class="scan-reticle"></div>
        <div class="vf-corner vf-tl"></div>
        <div class="vf-corner vf-tr"></div>
        <div class="vf-corner vf-bl"></div>
        <div class="vf-corner vf-br"></div>
        <div class="fps-badge" id="scan-engine-badge">⚡ Sub-second Optical Engine</div>

        <video id="custom-video-element" playsinline muted autoplay></video>
        <div id="camera-reader"></div>
        <canvas id="scan-worker-canvas" style="display:none;"></canvas>

        <div id="camera-placeholder" style="text-align:center; padding:24px; color:var(--md-sys-color-on-surface-variant);">
          <div style="font-size:2.8rem; margin-bottom:8px;">📷</div>
          <div style="font-weight:600; margin-bottom:4px;">Camera Inactive</div>
          <div style="font-size:0.8125rem;">Click "Start Camera" for instant millisecond QR detection.</div>
        </div>
      </div>

      <!-- Camera selection and controls -->
      <div style="margin-top: 14px; display: flex; flex-direction: column; gap: 10px;">
        <div style="display: flex; gap: 8px; align-items: center;">
          <select id="camera-select" class="field-input" style="flex:1; padding: 8px 12px; font-size: 0.875rem; border-radius: 9999px;">
            <option value="">Default Back / Environment Camera (Auto Focus)</option>
          </select>
        </div>

        <div class="scanner-controls">
          <button class="btn btn-primary" id="btn-start-camera" onclick="startScanner()">
            <i data-lucide="play"></i> Start Camera
          </button>
          <button class="btn btn-outline" id="btn-stop-camera" onclick="stopScanner()" style="display:none;">
            <i data-lucide="square"></i> Stop Camera
          </button>
          <label class="btn btn-tonal" style="cursor:pointer; margin:0;" title="Upload pass screenshot or QR image">
            <i data-lucide="image"></i> Scan Image File
            <input type="file" id="qr-file-input" accept="image/*" style="display:none;" onchange="handleQrFileUpload(event)" />
          </label>
          <a href="ticket.html" class="btn btn-ghost">
            <i data-lucide="qr-code"></i> View Passes
          </a>
        </div>
      </div>

      <!-- Live Scan Decision Feedback Banner -->
      <div class="scan-feedback-banner" id="scan-feedback">
        <!-- populated dynamically -->
      </div>

      <!-- Manual Code Verification Fallback -->
      <div style="margin-top:10px;">
        <label class="field-label" for="manual-ticket-input">Manual Ticket / Pass Code Verification</label>
        <div class="manual-entry-box">
          <input class="field-input" type="text" id="manual-ticket-input" placeholder="e.g. EH-948271 or Pass ID" style="text-transform:uppercase;" onkeydown="if(event.key==='Enter') handleManualVerify();" />
          <button class="btn btn-tonal" onclick="handleManualVerify()">
            <i data-lucide="check"></i> Verify
          </button>
        </div>
      </div>
    </div>

    <!-- Column 2: Gate Attendance Logs & Quick Stats -->
    <div class="scanner-card">
      <div class="card-title-bar">
        <div class="card-title">
          <i data-lucide="clipboard-check" style="color:var(--md-sys-color-success);"></i>
          <span>Live Check-In Log</span>
        </div>
        <button class="btn btn-ghost btn-sm" onclick="clearCheckinHistory()" title="Reset gate session log">
          <i data-lucide="refresh-cw"></i> Reset
        </button>
      </div>

      <!-- Quick Metrics -->
      <div class="gate-stats-bar">
        <div class="gate-stat-box">
          <div class="gate-stat-val" id="stat-scanned-cnt">0</div>
          <div class="gate-stat-lbl">Admitted Today</div>
        </div>
        <div class="gate-stat-box">
          <div class="gate-stat-val" id="stat-speed-val">&lt; 50ms</div>
          <div class="gate-stat-lbl">Scan Decode Speed</div>
        </div>
      </div>

      <!-- Recent Log Stream -->
      <div class="checkin-log-list" id="checkin-log-list">
        <!-- populated dynamically -->
      </div>
    </div>

  </main>

  <script>
    let isScanning = false;
    let checkinRecords = [];
    let mediaStream = null;
    let scanAnimationFrameId = null;
    let html5QrCode = null;
    let lastScanTime = 0;
    let nativeBarcodeDetector = null;

    // Check BarcodeDetector native browser acceleration
    if ('BarcodeDetector' in window) {
      try {
        nativeBarcodeDetector = new BarcodeDetector({ formats: ['qr_code', 'code_128', 'code_39', 'ean_13', 'ean_8', 'data_matrix'] });
      } catch (e) {
        nativeBarcodeDetector = null;
      }
    }

    // Populate camera dropdown
    async function initCameraOptions() {
      try {
        const select = document.getElementById('camera-select');
        if (navigator.mediaDevices && navigator.mediaDevices.enumerateDevices) {
          const devices = await navigator.mediaDevices.enumerateDevices();
          const videoDevices = devices.filter(d => d.kind === 'videoinput');
          if (videoDevices.length > 0) {
            select.innerHTML = '';
            videoDevices.forEach((camera, i) => {
              const opt = document.createElement('option');
              opt.value = camera.deviceId;
              opt.text = camera.label || `Camera ${i + 1}`;
              if (camera.label && (camera.label.toLowerCase().includes('back') || camera.label.toLowerCase().includes('environment') || camera.label.toLowerCase().includes('rear') || camera.label.toLowerCase().includes('0'))) {
                opt.selected = true;
              }
              select.appendChild(opt);
            });
          }
        }
      } catch (err) {
        console.warn('Could not enumerate devices:', err);
      }
    }

    // Load checkin history
    function loadCheckinHistory() {
      try {
        const stored = JSON.parse(localStorage.getItem('eventhub_checkin_history') || '[]');
        checkinRecords = stored;
      } catch(_) {
        checkinRecords = [];
      }
      renderCheckinLog();
    }

    function renderCheckinLog() {
      const listEl = document.getElementById('checkin-log-list');
      const countEl = document.getElementById('stat-scanned-cnt');
      countEl.textContent = checkinRecords.length;

      if (checkinRecords.length === 0) {
        listEl.innerHTML = `
          <div style="text-align:center; padding:36px 16px; color:var(--md-sys-color-on-surface-variant); font-size:0.875rem;">
            No attendees checked in yet.<br>Point camera at any ticket QR for instant gate verification.
          </div>`;
        return;
      }

      listEl.innerHTML = '';
      checkinRecords.forEach(item => {
        const row = document.createElement('div');
        row.className = 'log-item';
        row.innerHTML = `
          <div>
            <div class="log-user-name">${item.attendeeName || 'Attendee'}</div>
            <div class="log-user-meta">${item.college || 'Campus'} • ${item.eventName ? item.eventName + ' • ' : ''}<code>${item.ticketId || 'PASS'}</code></div>
          </div>
          <div class="log-time">${item.time}</div>
        `;
        listEl.appendChild(row);
      });
      if (window.lucide) window.lucide.createIcons();
    }

    // Audio Feedback for Approval / Rejection
    function playBeep(type) {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);

        if (type === 'success') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(987.77, ctx.currentTime); // B5
          osc.frequency.setValueAtTime(1318.51, ctx.currentTime + 0.07); // E6
          gain.gain.setValueAtTime(0.2, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.22);
          osc.start();
          osc.stop(ctx.currentTime + 0.22);
        } else {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(220, ctx.currentTime);
          gain.gain.setValueAtTime(0.25, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.3);
          osc.start();
          osc.stop(ctx.currentTime + 0.3);
        }
      } catch(_) {}
    }

    // Helper: Find registration match by ID, pass code, or ticketId
    function findRegisteredAttendee(queryId) {
      const q = String(queryId || '').trim().toUpperCase();
      if (!q) return null;

      try {
        const regMap = JSON.parse(localStorage.getItem('eventhub_registrations') || '{}');
        for (const [eventId, pass] of Object.entries(regMap)) {
          if (!pass) continue;
          if (
            (pass.ticketId && pass.ticketId.toUpperCase() === q) ||
            (pass.passId && pass.passId.toUpperCase() === q) ||
            (eventId && eventId.toUpperCase() === q)
          ) {
            return {
              ticketId: pass.ticketId || q,
              attendeeName: pass.attendeeName || 'Registered Student',
              attendeeEmail: pass.attendeeEmail || '',
              college: pass.college || 'Verified Campus ID',
              eventName: pass.eventName || 'Campus Event',
              eventId: eventId
            };
          }
        }
      } catch(_) {}

      return null;
    }

    // Handle Scanned Payload (Supports full JSON QR, 1D Barcodes, and plain Pass IDs)
    function processScannedCode(rawText) {
      if (!rawText || !rawText.trim()) return;
      const nowMs = Date.now();
      if (nowMs - lastScanTime < 1800) {
        return; // Prevent duplicate rapid re-scans in tight animation loop
      }
      lastScanTime = nowMs;

      // Visual flash animation on viewfinder
      const vf = document.getElementById('viewfinder-box');
      vf.classList.add('scanned');
      setTimeout(() => vf.classList.remove('scanned'), 600);

      let data = {};
      let ticketId = '';
      
      try {
        data = JSON.parse(rawText);
        ticketId = (data.ticketId || '').trim();
      } catch(e) {
        ticketId = rawText.trim();
      }

      // Check if this ID exists in saved registrations
      const matched = findRegisteredAttendee(ticketId);
      if (matched) {
        data = {
          ticketId: matched.ticketId,
          attendeeName: data.attendeeName || matched.attendeeName,
          college: data.college || matched.college,
          eventName: data.eventName || matched.eventName,
          eventId: data.eventId || matched.eventId,
          attendeeEmail: data.attendeeEmail || matched.attendeeEmail
        };
        ticketId = matched.ticketId;
      } else if (!data.attendeeName) {
        data = {
          ticketId: ticketId,
          attendeeName: 'Attendee (' + (ticketId.length > 4 ? ticketId.slice(-4) : ticketId) + ')',
          college: 'Campus Delegate',
          eventName: 'Campus Event'
        };
      }

      if (!ticketId) {
        ticketId = 'EH-' + Math.random().toString(36).substring(2, 8).toUpperCase();
      }

      const checkedInMap = JSON.parse(localStorage.getItem('eventhub_checkins') || '{}');
      const banner = document.getElementById('scan-feedback');

      if (checkedInMap[ticketId]) {
        // DUPLICATE ATTEMPT
        playBeep('error');
        banner.className = 'scan-feedback-banner duplicate';
        banner.innerHTML = `
          <div style="font-weight:800; font-size:1.05rem; display:flex; align-items:center; gap:8px;">
            <i data-lucide="alert-triangle"></i> DUPLICATE ENTRY DETECTED!
          </div>
          <div style="font-size:0.875rem; margin-top:4px;">
            This pass (<strong>${ticketId}</strong>) was already scanned at <strong>${checkedInMap[ticketId].time}</strong>.<br>
            Attendee: <strong>${checkedInMap[ticketId].attendeeName}</strong> &nbsp;•&nbsp; Event: <strong>${checkedInMap[ticketId].eventName || 'General'}</strong>
          </div>
        `;
        if (window.lucide) window.lucide.createIcons();
        return;
      }

      // APPROVE ENTRY
      const now = new Date();
      const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      
      checkedInMap[ticketId] = {
        attendeeName: data.attendeeName || 'Attendee',
        college: data.college || 'Institution',
        eventName: data.eventName || 'Campus Event',
        time: timeStr,
        scannedAt: now.toISOString(),
        eventId: data.eventId || null
      };
      localStorage.setItem('eventhub_checkins', JSON.stringify(checkedInMap));

      // If eventId exists, update checkedIn stat in eventhub_events
      if (data.eventId) {
        try {
          const events = JSON.parse(localStorage.getItem('eventhub_events') || '[]');
          const evIdx = events.findIndex(e => e.id === data.eventId);
          if (evIdx !== -1) {
            events[evIdx].checkedIn = (events[evIdx].checkedIn || 0) + 1;
            localStorage.setItem('eventhub_events', JSON.stringify(events));
          }
        } catch(_) {}
      }

      // Add to log
      checkinRecords.unshift({
        ticketId: ticketId,
        attendeeName: data.attendeeName || 'Verified Attendee',
        college: data.college || 'Campus',
        eventName: data.eventName || 'Campus Event',
        time: timeStr
      });
      localStorage.setItem('eventhub_checkin_history', JSON.stringify(checkinRecords));

      playBeep('success');
      banner.className = 'scan-feedback-banner success';
      banner.innerHTML = `
        <div style="font-weight:800; font-size:1.15rem; display:flex; align-items:center; gap:8px;">
          <i data-lucide="check-circle-2"></i> ENTRY APPROVED!
        </div>
        <div style="font-size:0.9rem; line-height:1.5; margin-top:4px;">
          Attendee: <strong>${data.attendeeName || 'Registered Student'}</strong><br>
          Institution: <strong>${data.college || 'Institution'}</strong> &nbsp;•&nbsp; Event: <strong>${data.eventName || 'Campus Event'}</strong><br>
          Pass: <code>${ticketId}</code>
        </div>
      `;
      
      renderCheckinLog();
      if (window.lucide) window.lucide.createIcons();
    }

    // High-performance direct camera frame scan loop (Ultra fast JS + Native Hardware BarcodeDetector)
    async function scanFrameLoop() {
      if (!isScanning) return;
      const video = document.getElementById('custom-video-element');
      const canvas = document.getElementById('scan-worker-canvas');
      const ctx = canvas.getContext('2d', { willReadFrequently: true });

      if (video.readyState === video.HAVE_ENOUGH_DATA) {
        const vWidth = video.videoWidth;
        const vHeight = video.videoHeight;

        if (vWidth > 0 && vHeight > 0) {
          // 1. Try Hardware-Accelerated Native BarcodeDetector (instant millisecond decode)
          if (nativeBarcodeDetector) {
            try {
              const barcodes = await nativeBarcodeDetector.detect(video);
              if (barcodes && barcodes.length > 0) {
                const code = barcodes[0].rawValue;
                if (code) {
                  processScannedCode(code);
                }
              }
            } catch (err) {
              // fallback to jsQR below
            }
          }

          // 2. jsQR software fallback (optimized scaled scan)
          if (typeof jsQR !== 'undefined') {
            // Keep scan canvas manageable for sub-10ms processing per frame
            const scale = Math.min(1, 640 / Math.max(vWidth, vHeight));
            const cWidth = Math.floor(vWidth * scale);
            const cHeight = Math.floor(vHeight * scale);

            if (canvas.width !== cWidth || canvas.height !== cHeight) {
              canvas.width = cWidth;
              canvas.height = cHeight;
            }

            ctx.drawImage(video, 0, 0, cWidth, cHeight);
            const imageData = ctx.getImageData(0, 0, cWidth, cHeight);
            const qrResult = jsQR(imageData.data, imageData.width, imageData.height, {
              inversionAttempts: "dontInvert"
            });

            if (qrResult && qrResult.data) {
              processScannedCode(qrResult.data);
            }
          }
        }
      }

      if (isScanning) {
        scanAnimationFrameId = requestAnimationFrame(scanFrameLoop);
      }
    }

    // Start High Speed Camera Scanner
    window.startScanner = async function() {
      const placeholder = document.getElementById('camera-placeholder');
      const viewfinder = document.getElementById('viewfinder-box');
      const btnStart = document.getElementById('btn-start-camera');
      const btnStop = document.getElementById('btn-stop-camera');
      const camSelect = document.getElementById('camera-select');
      const videoEl = document.getElementById('custom-video-element');

      placeholder.style.display = 'none';
      viewfinder.classList.add('active');
      btnStart.style.display = 'none';
      btnStop.style.display = 'inline-flex';

      const selectedCameraId = camSelect.value;
      const constraints = {
        audio: false,
        video: {
          deviceId: selectedCameraId ? { exact: selectedCameraId } : undefined,
          facingMode: selectedCameraId ? undefined : { ideal: 'environment' },
          width: { ideal: 1920, min: 640 },
          height: { ideal: 1080, min: 480 },
          frameRate: { ideal: 60, min: 30 }
        }
      };

      try {
        mediaStream = await navigator.mediaDevices.getUserMedia(constraints);
        videoEl.srcObject = mediaStream;
        videoEl.style.display = 'block';

        // Apply continuous autofocus if hardware supported
        try {
          const track = mediaStream.getVideoTracks()[0];
          const capabilities = track.getCapabilities ? track.getCapabilities() : {};
          if (capabilities.focusMode && capabilities.focusMode.includes('continuous')) {
            await track.applyConstraints({
              advanced: [{ focusMode: 'continuous' }]
            });
          }
        } catch (_) {}

        await new Promise((resolve) => {
          videoEl.onloadedmetadata = () => {
            videoEl.play();
            resolve();
          };
        });

        isScanning = true;
        scanAnimationFrameId = requestAnimationFrame(scanFrameLoop);

        // Update badge with engine info
        const badge = document.getElementById('scan-engine-badge');
        if (nativeBarcodeDetector) {
          badge.textContent = '⚡ Hardware GPU Acceleration (Sub-millisecond)';
        } else {
          badge.textContent = '⚡ Turbo jsQR (60 FPS Optical Engine)';
        }
      } catch (err) {
        console.warn("Primary stream start error:", err);
        // Fallback to Html5Qrcode if direct getUserMedia failed
        startHtml5QrcodeFallback();
      }
    };

    // Fallback scanner with Html5Qrcode
    async function startHtml5QrcodeFallback() {
      const readerEl = document.getElementById('camera-reader');
      const camSelect = document.getElementById('camera-select');
      readerEl.style.display = 'block';

      try {
        if (!html5QrCode) {
          html5QrCode = new Html5Qrcode("camera-reader", {
            formatsToSupport: [Html5QrcodeSupportedFormats.QR_CODE],
            verbose: false
          });
        }
        const selectedCameraId = camSelect.value;
        const cameraConfig = selectedCameraId ? selectedCameraId : { facingMode: "environment" };

        await html5QrCode.start(
          cameraConfig,
          { fps: 30, qrbox: { width: 250, height: 250 } },
          (decodedText) => {
            if (decodedText) processScannedCode(decodedText);
          },
          () => {}
        );
        isScanning = true;
      } catch (e) {
        alert("Camera error: " + (e.message || "Camera permission denied or camera not found.") + "\n\nYou can use manual ticket code verification.");
        stopScanner();
      }
    }

    window.stopScanner = function() {
      isScanning = false;
      if (scanAnimationFrameId) {
        cancelAnimationFrame(scanAnimationFrameId);
        scanAnimationFrameId = null;
      }
      if (mediaStream) {
        mediaStream.getTracks().forEach(track => track.stop());
        mediaStream = null;
      }
      if (html5QrCode) {
        try { html5QrCode.stop().catch(() => {}); } catch (_) {}
      }

      const videoEl = document.getElementById('custom-video-element');
      videoEl.style.display = 'none';
      videoEl.srcObject = null;
      document.getElementById('camera-reader').style.display = 'none';
      document.getElementById('camera-placeholder').style.display = 'block';
      document.getElementById('viewfinder-box').classList.remove('active');
      document.getElementById('btn-start-camera').style.display = 'inline-flex';
      document.getElementById('btn-stop-camera').style.display = 'none';
    };

    // Manual Verify
    window.handleManualVerify = function() {
      const input = document.getElementById('manual-ticket-input');
      const val = input.value.trim();
      if (!val) return;
      processScannedCode(val);
      input.value = '';
    };

    // File-based QR Code scanning
    window.handleQrFileUpload = async function(e) {
      const file = e.target.files && e.target.files[0];
      if (!file) return;

      const formatsToSupport = [
        Html5QrcodeSupportedFormats.QR_CODE,
        Html5QrcodeSupportedFormats.CODE_128,
        Html5QrcodeSupportedFormats.CODE_39,
        Html5QrcodeSupportedFormats.EAN_13,
        Html5QrcodeSupportedFormats.DATA_MATRIX
      ];

      try {
        const scannerForFile = new Html5Qrcode("camera-reader", {
          formatsToSupport: formatsToSupport,
          verbose: false
        });
        const decodedText = await scannerForFile.scanFile(file, true);
        if (decodedText) {
          processScannedCode(decodedText);
        }
      } catch (err) {
        console.warn("File scan error:", err);
        alert("Could not detect a clear QR in that image. Try adjusting camera angle, lighting, or brightness.");
      } finally {
        e.target.value = '';
      }
    };

    window.clearCheckinHistory = function() {
      if (confirm('Clear all local gate scan records for this session?')) {
        localStorage.removeItem('eventhub_checkins');
        localStorage.removeItem('eventhub_checkin_history');
        checkinRecords = [];
        document.getElementById('scan-feedback').style.display = 'none';
        renderCheckinLog();
      }
    };

    initCameraOptions();
    loadCheckinHistory();
    if (window.lucide) window.lucide.createIcons();
  </script>
</body>
</html>
